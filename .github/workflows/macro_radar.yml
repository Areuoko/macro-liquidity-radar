name: Macro Liquidity & Central Bank Radar

on:
  schedule:
    # اجرا هر دوشنبه ساعت 06:00 صبح UTC (پیش از شروع بازارهای هفتگی)
    - cron: '0 6 * * 1'
  workflow_dispatch: # امکان اجرای دستی با یک کلیک در گیت‌هاب

jobs:
  run-macro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Macro Alpha Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_once.py
